<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d4f46"/>
      <stop offset="1" stop-color="#1f3f36"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#edefde"/>
      <stop offset="1" stop-color="#dfe2d0"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e4d2"/>
      <stop offset="1" stop-color="#ecefdc"/>
    </linearGradient>
    <linearGradient id="knob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e8cd"/>
      <stop offset="1" stop-color="#c7bca2"/>
    </linearGradient>
    <radialGradient id="btn" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#e05245"/>
      <stop offset="1" stop-color="#c63428"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- robot drawn at 1x and scaled up 1.12x, centered in the tile -->
  <g transform="translate(-30.72 -43.92) scale(1.12)">
    <!-- drop shadow -->
    <g transform="translate(0 16)" opacity="0.42" filter="url(#sh)" fill="#09120f">
      <path d="M175 146H337A72 72 0 0 1 409 218V308A72 72 0 0 1 337 380H175L103 452V218A72 72 0 0 1 175 146Z"/>
      <circle cx="103" cy="263" r="27"/>
      <circle cx="409" cy="263" r="27"/>
    </g>
    <!-- antenna -->
    <rect x="248" y="104" width="16" height="45" fill="#8fa893"/>
    <circle cx="256" cy="104" r="24" fill="url(#btn)"/>
    <!-- ears -->
    <circle cx="103" cy="263" r="27" fill="url(#knob)"/>
    <circle cx="409" cy="263" r="27" fill="url(#knob)"/>
    <!-- speech bubble case -->
    <path d="M175 146H337A72 72 0 0 1 409 218V308A72 72 0 0 1 337 380H175L103 452V218A72 72 0 0 1 175 146Z" fill="url(#case)"/>
    <!-- face plate with inset edge -->
    <path d="M175 182H337A36 36 0 0 1 373 218V308A36 36 0 0 1 337 344H175A36 36 0 0 1 139 308V218A36 36 0 0 1 175 182Z" fill="url(#face)"/>
    <path d="M175 185H337A36 36 0 0 1 373 221V311A36 36 0 0 1 337 347H175A36 36 0 0 1 139 311V221A36 36 0 0 1 175 185Z" fill="none" stroke="#fff" stroke-opacity="0.8" stroke-width="5"/>
    <path d="M175 182H337A36 36 0 0 1 373 218V308A36 36 0 0 1 337 344H175A36 36 0 0 1 139 308V218A36 36 0 0 1 175 182Z" fill="none" stroke="#9fb699" stroke-width="7"/>
    <!-- eyes -->
    <rect x="184" y="222" width="36" height="54" rx="18" fill="#1b342d"/>
    <rect x="292" y="222" width="36" height="54" rx="18" fill="#1b342d"/>
  </g>
</svg>
